name: goreleaser

on:
  push:
    tags:
      - '*'

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.19.0'
      - name: Install goreleaser
        # goreleaser v1 (github.com/goreleaser/goreleaser) no longer builds
        # with current Go releases; v2 lives under the /v2 module path.
        run: go install github.com/goreleaser/goreleaser/v2@v2.18.3
      - name: Create release
        run: |
          make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update new version in krew-index
        uses: rajatjindal/krew-release-bot@v0.0.38
